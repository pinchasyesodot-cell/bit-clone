version: "3.8"

services:
  user-db:
    image: mongo:latest
    restart: always
    container_name: db-user-service
    ports:
      - "27017:27017"
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - user-db-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{ _id: 0, host: 'user-db:27017' }]}) }"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
  user-service:
    build:
      context: ./user-service
    restart: always
    env_file: ./user-service/.env
    container_name: user-service
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - ./user-service:/src/app
      - ./user-service/node_modules:/src/app/node_modules
    depends_on:
      - user-db
  nginx:
    image: nginx:latest
    container_name: nginx_server
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - user-service
volumes:
  user-db-data:
