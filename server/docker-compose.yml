services:
  # ==============================
  # User Service Ecosystem
  # ==============================

  # ==============================
  # Saga Orchestrator Ecosystem
  # ==============================

  saga-db:
    image: mongo:7
    restart: always
    container_name: db-saga-orchestrator
    volumes:
      - saga-db-data:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: always
    container_name: rabbitmq-broker
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    env_file:
      - ./saga-service/.env.docker

  saga-service:
    build:
      context: ./saga-service
    restart: always
    env_file:
      - ./saga-service/.env
      - ./saga-service/.env.docker
    container_name: saga-service
    volumes:
      - saga-service-logs:/src/app/logs
    depends_on:
      saga-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ==============================
  # API Gateway / Reverse Proxy
  # ==============================
  
  nginx:
    image: nginx:latest
    container_name: nginx_server
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - saga-service
volumes:
  saga-db-data:
  saga-service-logs:
